<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>console-band · Option 3: Width Sweep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Funnel+Sans:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- Family tokens (identical on every Labs product) ---------- */
:root{
  color-scheme: light dark;
  --font-display:"Funnel Display", ui-sans-serif, system-ui, sans-serif;
  --font-text:"Funnel Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --lab-ink: light-dark(#121A2B, #E9EEF6);
  --lab-paper: light-dark(#FFFFFF, #1A2130);
  --lab-line: light-dark(#C3CCD9, #38435A);
  --lab-mut: light-dark(#4D5868, #A8B3C4);
  --r-s: 8px; --r-m: 14px; --r-l: 22px;
  --wrap: 1240px;
  --pad: clamp(20px, 4vw, 48px);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  /* console-band's own terminal colours (hooks/register.tsx), fixed in both themes */
  --k-teal:#4aa3b8; --k-orange:#e8734a; --k-green:#3ec28f; --k-yellow:#e5c07b; --k-red:#e05561;
  --k-purple:#b48ead; --k-blue:#8fb3e8; --k-grey:#9aa0a6; --k-dim:#3a3f47; --k-text:#d8dee9; --k-cleared:#7f8cff;
  --band-fs: 13px;
}
html[data-theme="light"]{color-scheme: light}
html[data-theme="dark"]{color-scheme: dark}

/* ---------- Product set: console-band, Option 3 "Width Sweep" (azure) ---------- */
:root{
  --ground: light-dark(#F6F8FE, #0B0E1A);
  --wall: light-dark(#DCE5FB, #151D3A);
  --floor: light-dark(#EEF2FD, #0F1529);
  --surface: light-dark(#FFFFFF, #141A2E);
  --surface-2: light-dark(#F1F4FD, #1B2340);
  --ink: light-dark(#0F1630, #E7EAF7);
  --mut: light-dark(#4A5272, #A6ADCB);
  --line: light-dark(#D0D9F0, #283256);
  --accent: light-dark(#2450C8, #9DB7FF);
  --accent-ink: light-dark(#FFFFFF, #0A1433);
  --accent-soft: light-dark(#E0E8FD, #1F2C58);
  --term: light-dark(#0D1124, #080B18);
  --term-bar: light-dark(#141A33, #0F1428);
  --term-line: light-dark(#0D1124, #232C4E);
  --shadow: light-dark(rgb(15 22 48 / .16), rgb(0 0 0 / .6));
}
/* Hero: headline and command left; the compact band in a narrow terminal right, on its own sweep */
.o3-head{display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:32px 56px; align-items:center; padding-block:clamp(36px, 5vw, 64px)}
.hero h1{font-size:clamp(2.6rem, 1.5rem + 3.6vw, 4.5rem); line-height:1.02; letter-spacing:-.035em; font-weight:700; max-width:12ch}
.o3-copy{display:grid; gap:22px}
.o3-mini{border-radius:var(--r-l); background:linear-gradient(to bottom, var(--wall), var(--floor)); padding:clamp(24px, 4vw, 48px) clamp(16px, 3vw, 36px); display:grid; gap:14px; justify-items:center}
.o3-mini .term{width:min(100%, 520px)}
.o3-mini .cap{margin:0}
.stage-grid{display:grid; gap:28px; grid-template-columns:minmax(0,1fr)}
.device-wrap, .device{min-width:0}
.scenes{justify-self:center}
.o3-win{font-family:var(--font-mono); font-size:var(--band-fs); width:min(100%, calc(var(--cols) * 1ch + 38px)); margin-inline:auto; transition:width .6s var(--ease-out)}
.o3-win .term-body{overflow-x:auto; scrollbar-width:thin}
.o3-win .term-body [data-band]{overflow:visible}
.o3-win .term-bar{font-family:var(--font-text)}
.colsnote{font-family:var(--font-mono); color:var(--k-teal)}
.notes{grid-template-columns:repeat(3, minmax(0,1fr)); margin-top:24px}
.pace-legend{list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px 20px; font-size:.9375rem}
.pace-legend li{display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center}
.pace-legend b{font-family:var(--font-mono); background:var(--term); border-radius:6px; text-align:center; padding:2px 0; font-weight:700}
.tile.big{font-size:14px}
@media (max-width: 860px){
  .o3-head{grid-template-columns:1fr}
  .scenes{justify-self:stretch}
  .notes{grid-template-columns:1fr}
  .pace-legend{grid-template-columns:1fr}
}


/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth; scrollbar-color: var(--line) var(--ground); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-text); font-size:1.0625rem; line-height:1.55; caret-color:var(--accent); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
::selection{background:var(--accent); color:var(--accent-ink)}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; text-wrap:balance; font-weight:650}
p{margin:0; text-wrap:pretty}
a{color:inherit; text-underline-offset:.2em; text-decoration-thickness:1px}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:6px}
code{font-family:var(--font-mono); font-size:.9em}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.wrap{max-width:var(--wrap); margin-inline:auto; padding-inline:var(--pad)}
.skip{position:absolute; left:12px; top:-60px; z-index:50; background:var(--surface); padding:12px 16px; border-radius:var(--r-s)}
.skip:focus{top:12px}
svg.i{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}

/* ---------- Demo shell bar (mockup only, not part of the page) ---------- */
.shell{background:var(--lab-ink); color:var(--lab-paper); font-size:.875rem; padding-block:2px}
.shell .wrap{display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between; padding-block:8px}
.shell-tag{font-weight:600}
.seg{display:inline-flex; border:1px solid color-mix(in srgb, var(--lab-paper) 30%, transparent); border-radius:12px; padding:3px}
.seg button{min-height:44px; min-width:44px; padding:0 14px; border:0; border-radius:9px; background:none; color:inherit; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lab-paper); color:var(--lab-ink); font-weight:600}
.seg button:focus-visible{outline-color:var(--lab-paper)}

/* ---------- Nav ---------- */
.nav{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--ground) 92%, transparent); backdrop-filter:saturate(1.2); border-bottom:1px solid transparent; transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .wrap{display:flex; align-items:center; gap:16px; min-height:72px}
.brand{display:inline-flex; align-items:center; gap:10px; text-decoration:none; font-family:var(--font-display); font-weight:700; font-size:1.3125rem; letter-spacing:-.02em; min-height:44px}
.brand svg{width:30px; height:30px; flex:none}
.nav-links{display:flex; gap:2px; margin-left:auto}
.nav-links a{display:inline-flex; align-items:center; min-height:44px; padding:0 12px; text-decoration:none; color:var(--mut); border-radius:8px}
.nav-links a:hover{color:var(--ink); background:var(--surface-2)}
.lang{display:inline-flex; border:1px solid var(--line); border-radius:12px; padding:2px}
.lang button{min-width:44px; min-height:44px; border:0; background:none; border-radius:9px; color:var(--mut); cursor:pointer; font-weight:600; font-size:.875rem}
.lang button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px var(--shadow)}
.icon-btn{display:inline-grid; place-items:center; width:44px; height:44px; border-radius:10px; color:var(--mut); text-decoration:none}
.icon-btn:hover{color:var(--ink); background:var(--surface-2)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border-radius:12px; border:1px solid transparent; font-weight:600; text-decoration:none; cursor:pointer; white-space:nowrap; transition:background-color .15s, box-shadow .15s, transform .15s var(--ease-out)}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:0 1px 0 rgb(255 255 255 / .18) inset, 0 6px 16px -6px var(--shadow)}
.btn-primary:hover{background:color-mix(in srgb, var(--accent) 88%, var(--ink))}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{border-color:var(--line); background:var(--surface); color:var(--ink)}
.btn-ghost:hover{border-color:var(--mut)}
.btn-sm{min-height:44px; padding:0 16px; font-size:.9375rem}

/* ---------- Install command (the CTA) ---------- */
.cta{display:grid; gap:12px}
.cmd{display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:6px 6px 6px 16px; min-height:60px}
.cmd code{flex:1; min-width:0; font-size:.9375rem; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; padding-block:6px}
.cmd code::before{content:"> " / ""; color:var(--mut)}
.cmd .btn{flex:none}
.cta-row{display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center}
.cta-row .note{font-size:.875rem; color:var(--mut)}

/* ---------- Terminal and band (the product) ---------- */
.term{text-align:left; background:var(--term); color:var(--k-text); border-radius:14px; border:1px solid var(--term-line); overflow:hidden; box-shadow:0 2px 4px var(--shadow), 0 50px 80px -40px var(--shadow)}
.term-bar{display:flex; align-items:center; gap:12px; height:40px; padding:0 14px; background:var(--term-bar); color:var(--k-grey); font-size:12.5px; border-bottom:1px solid var(--term-line)}
.term-bar .dots{display:flex; gap:7px}
.term-bar .dots i{width:11px; height:11px; border-radius:50%; background:#3a3f47}
.term-bar .t{flex:1; text-align:center}
.term-body{padding:16px 18px 16px; font-family:var(--font-mono); font-size:var(--band-fs); line-height:1.5}
.ts{color:var(--k-grey); margin:0 0 12px; white-space:pre-wrap}
.ts b{color:var(--k-text); font-weight:500}
.band{margin:0; font:inherit; white-space:pre; overflow:hidden}
.band .r{display:block; min-height:1.5em; border-radius:3px; transition:opacity .25s, background-color .25s}
.band.has-lit .r:not(.is-lit){opacity:.3}
.band .r.is-lit{background:rgb(255 255 255 / .07); box-shadow:-6px 0 0 rgb(255 255 255 / .07), 6px 0 0 rgb(255 255 255 / .07)}
.k-t{color:var(--k-teal)} .k-o{color:var(--k-orange)} .k-gr{color:var(--k-green)} .k-y{color:var(--k-yellow)} .k-r{color:var(--k-red)}
.k-p{color:var(--k-purple)} .k-b{color:var(--k-blue)} .k-g{color:var(--k-grey)} .k-d{color:var(--k-dim)} .k-x{color:var(--k-text)} .k-cl{color:var(--k-cleared)}
.band .bo{font-weight:700}
.prompt{margin-top:12px; display:flex; align-items:center; gap:10px; border:1px solid #3a3f47; border-radius:8px; padding:9px 12px; color:var(--k-grey); white-space:nowrap; overflow:hidden}
.prompt .gt{color:var(--k-text)}
.caret{display:inline-block; width:.6em; height:1.15em; background:var(--k-text); vertical-align:-3px; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tile{text-align:left; min-width:0; overflow:hidden; background:var(--term); border:1px solid var(--term-line); border-radius:12px; padding:14px 16px; font-family:var(--font-mono); font-size:12px; line-height:1.5; color:var(--k-text); box-shadow:0 1px 2px var(--shadow), 0 20px 36px -24px var(--shadow); width:100%}
.tile + .cap, .cap{font-size:.8125rem; color:var(--mut); margin-top:10px; text-align:center}
.tile-stack{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; width:100%}
.tl{display:flex; justify-content:space-between; gap:12px; font-family:var(--font-text); font-size:.8125rem; color:var(--k-grey); margin-bottom:4px}
.tl b{color:var(--k-text); font-weight:600}

.legend{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.875rem; color:var(--ink)}
.legend li{display:inline-flex; align-items:center; gap:8px}
.legend i{width:14px; height:4px; border-radius:2px; background:var(--sw)}
.legend span{color:var(--mut); font-variant-numeric:tabular-nums}

/* ---------- Stage (studio sweep) ---------- */
.stage{position:relative; background:linear-gradient(to bottom, var(--wall) 0%, var(--wall) 52%, var(--floor) 80%, var(--ground) 100%); padding-block:clamp(28px, 4vw, 56px) clamp(64px, 7vw, 104px); overflow:hidden}
.scenes{display:flex; gap:4px; background:color-mix(in srgb, var(--surface) 60%, transparent); border:1px solid var(--line); border-radius:14px; padding:4px; overflow-x:auto; scrollbar-width:none}
.scene{flex:1 0 auto; display:grid; gap:0; min-height:48px; padding:6px 18px; border:1px solid transparent; border-radius:10px; background:none; cursor:pointer; color:var(--ink); text-align:center; place-content:center}
.scene strong{font-family:var(--font-display); font-size:1rem; font-weight:650; letter-spacing:-.01em}
.scene span{font-size:.8125rem; color:var(--mut)}
.scene:hover{background:color-mix(in srgb, var(--surface) 55%, transparent)}
.scene[aria-selected="true"]{background:var(--surface); border-color:var(--line); box-shadow:0 1px 2px var(--shadow), 0 10px 24px -14px var(--shadow)}
.device-wrap{position:relative; margin:0; display:grid; justify-items:center}
.device-wrap::after{content:""; position:absolute; left:12%; right:12%; bottom:-34px; height:44px; background:radial-gradient(closest-side, var(--shadow), transparent); z-index:0; pointer-events:none}
.device{position:relative; z-index:1; width:100%; animation:settle 1.1s var(--ease-out) both}
@keyframes settle{from{transform:translateY(-14px)}to{transform:none}}
.synthetic{position:absolute; bottom:-32px; right:0; font-size:.8125rem; color:var(--mut); z-index:1}
.notes{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.note-btn{display:flex; gap:12px; align-items:flex-start; width:100%; min-height:48px; padding:12px 14px; text-align:left; border:1px solid transparent; border-radius:12px; background:none; color:var(--ink); cursor:pointer; font-size:.9375rem; line-height:1.4}
.note-btn .pin{display:grid; place-items:center; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--accent); color:var(--accent); flex:none; margin-top:-1px}
.note-btn .pin::after{content:""; width:8px; height:8px; border-radius:50%; background:currentColor; transform:scale(.6); transition:transform .2s var(--ease-out)}
.note-btn:hover, .note-btn[aria-pressed="true"]{background:color-mix(in srgb, var(--surface) 70%, transparent); border-color:var(--line)}
.note-btn:hover .pin::after, .note-btn[aria-pressed="true"] .pin::after{transform:scale(1)}
.note-btn b{display:block; font-weight:600; font-family:var(--font-mono); font-size:.8125rem; letter-spacing:.02em; color:var(--mut); margin-bottom:2px}

/* ---------- Spec plate ---------- */
.spec{position:relative; z-index:2; margin-top:-44px}
.spec dl{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); margin:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:0 1px 2px var(--shadow), 0 24px 40px -30px var(--shadow)}
.spec dl > div{padding:22px 24px; border-left:1px solid var(--line); display:grid; gap:4px; align-content:start}
.spec dl > div:first-child{border-left:0}
.spec dt{font-size:.875rem; color:var(--mut)}
.spec dd{margin:0; font-family:var(--font-display); font-size:1.3125rem; font-weight:650; letter-spacing:-.015em; line-height:1.25}

/* ---------- Sections ---------- */
.section{padding-block:clamp(72px, 9vw, 128px)}
.sec-head{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:16px 56px; align-items:end; margin-bottom:clamp(32px, 4vw, 56px)}
.sec-head h2, .trust h2{font-size:clamp(2rem, 1.3rem + 2.4vw, 3.25rem); line-height:1.05; letter-spacing:-.03em; font-weight:700}
.sec-head p{color:var(--mut); max-width:44ch}
.closeups{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); grid-template-rows:auto auto; gap:24px}
.cu{display:grid; gap:18px; align-content:start}
.cu:first-child{grid-row:span 2}
.plinth{position:relative; border-radius:var(--r-l); background:linear-gradient(to bottom, var(--wall), var(--floor)); padding:clamp(20px, 3.5vw, 44px); display:grid; place-items:center; min-height:240px; overflow:hidden}
.cu:first-child .plinth{min-height:440px}
.plinth{grid-template-columns:minmax(0,1fr)}
.plinth > *{position:relative; width:100%; min-width:0}
[data-band]{min-width:0; overflow:hidden}
.cu h3{font-size:1.375rem; letter-spacing:-.015em; line-height:1.2}
.cu p{color:var(--mut); margin-top:6px; max-width:52ch}
.also{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px; margin:48px 0 0; padding:0}
.also > div{border-top:1px solid var(--line); padding-top:18px; display:grid; grid-template-columns:auto 1fr; gap:4px 12px}
.also svg{grid-row:span 2; color:var(--accent); margin-top:2px}
.also dt{font-weight:600}
.also dd{margin:0; color:var(--mut); font-size:.9375rem}

/* Steps */
.steps{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px; counter-reset:s}
.step{display:grid; gap:12px; align-content:start; padding-top:22px; border-top:1px solid var(--line); position:relative}
.step::before{counter-increment:s; content:counter(s); position:absolute; top:-15px; left:0; width:30px; height:30px; border-radius:50%; background:var(--ground); border:1px solid var(--line); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:.9375rem}
.step h3{font-size:1.25rem; letter-spacing:-.01em; margin-top:8px}
.step p{color:var(--mut)}
.chipline{margin-top:6px; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; min-height:52px}
.chipline code{font-size:.8125rem; overflow-wrap:anywhere}
.chipline svg{color:var(--accent)}

/* Trust (privacy) */
.trust-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:40px 64px; align-items:start}
.trust-lead p{color:var(--mut); margin-top:16px; max-width:42ch}
.ledger{margin:0; display:grid; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden}
.ledger > div{display:grid; grid-template-columns:150px minmax(0,1fr); gap:6px 24px; padding:20px 24px; border-top:1px solid var(--line)}
.ledger > div:first-child{border-top:0}
.ledger dt{font-weight:600; display:flex; gap:10px; align-items:flex-start}
.ledger dt svg{color:var(--accent); margin-top:2px}
.ledger dd{margin:0; color:var(--mut)}
.ledger dd code{color:var(--ink); background:var(--surface-2); border-radius:6px; padding:1px 6px; font-size:.8125rem}
.ledger .cmds{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}

/* FAQ */
.faq{max-width:860px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{display:flex; justify-content:space-between; align-items:center; gap:16px; min-height:64px; padding:12px 0; cursor:pointer; list-style:none; font-family:var(--font-display); font-size:1.1875rem; font-weight:600; letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{transition:transform .25s var(--ease-out); color:var(--mut)}
.faq details[open] summary svg{transform:rotate(45deg)}
.faq details p{color:var(--mut); padding:0 0 20px; max-width:68ch}
.faq details code{color:var(--ink)}

/* Final CTA */
.final{background:linear-gradient(to bottom, var(--ground), var(--wall) 30%, var(--wall)); padding-top:clamp(72px, 9vw, 120px); overflow:hidden; text-align:center}
.final h2{font-size:clamp(2.25rem, 1.4rem + 3vw, 4rem); line-height:1.03; letter-spacing:-.035em; font-weight:700}
.final .lead{margin:16px auto 0}
.final-act{margin:28px auto 0; max-width:620px; text-align:left}
.final .cta-row{justify-content:center}
.peek{margin-top:clamp(48px, 6vw, 72px); height:clamp(150px, 16vw, 210px); overflow:hidden; display:flex; justify-content:center; align-items:flex-start}
.peek .device{animation:none; max-width:1080px}
.lead{font-size:clamp(1.0625rem, 1rem + .3vw, 1.1875rem); color:var(--mut); max-width:48ch}

/* Footer and Labs plate (family element; footer only) */
.foot{border-top:1px solid var(--line); padding-block:48px 32px; font-size:.9375rem}
.foot-grid{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto; gap:32px 48px; align-items:start}
.foot p{color:var(--mut); margin-top:10px; max-width:36ch}
.foot ul{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.foot ul a{display:inline-flex; min-height:44px; align-items:center; text-decoration:none; color:var(--mut)}
.foot ul a:hover{color:var(--ink); text-decoration:underline}

const cwCache = {};

  $('also').innerHTML = t.also.map(([i, h, d]) => `<div>${ic(i)}<dt>${h}</dt><dd>${d}</dd></div>`).join('');
  $('how-h').textContent = t.howH; $('how-p').textContent = t.howP;
  $('steps').innerHTML = t.steps.map(([h, d], i) => `<li class="step"><h3>${h}</h3><p>${d}</p><div class="chipline">${ic('terminal')}<code>${t.stepChips[i]}</code></div></li>`).join('');
  $('trust-h').textContent = t.trustH; $('trust-p').textContent = t.trustP;
  const gitCmds = ['git rev-parse --abbrev-ref HEAD','git log -1 --format=%ct','git status --porcelain'];
  $('ledger').innerHTML = t.ledger.map(([i, k, v], n) => `<div><dt>${ic(i)}${k}</dt><dd>${v}${n === 0 ? `<span class="cmds">${gitCmds.map(c => `<code>${c}</code>`).join('')}</span>` : ''}</dd></div>`).join('');
  $('faq-h').textContent = t.faqH;
  $('faq-list').innerHTML = t.faq.map(([q, a]) => `<details><summary>${q}${ic('plus')}</summary><p>${a}</p></details>`).join('');
  $('final-h').textContent = t.finalH; $('final-p').textContent = t.finalP;
  $('final-cta').innerHTML = cmdBlock(t, true);
  $('peek').innerHTML = OPT.peek(t, H);
  $('foot-tag').textContent = t.footTag;
  $('foot-nav').setAttribute('aria-label', t.footNav);
  $('foot-links').innerHTML = t.footLinks.map(([l, h]) => `<li><a href="${h}">${l}</a></li>`).join('');
  const a = $('labs-foot'); a.href = `https://derinbay.com/${S.lang}/labs/`; a.hreflang = S.lang;
  a.innerHTML = `<span class="labs-mark">${labsMark}</span><span class="labs-text"><span>${t.labs}${ic('arrow')}</span><small>${t.labsSmall}</small></span>`;
  $('copyright').textContent = t.copyright; $('foot-note').textContent = t.footNote;
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.langBtn === S.lang));
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeBtn === S.theme));
  if(OPT.after) OPT.after(t, H);
  paintBands();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang-btn]');
  if(lb){ S.lang = lb.dataset.langBtn; render(); return; }
  const tb = e.target.closest('[data-theme-btn]');
  if(tb){ S.theme = tb.dataset.themeBtn; root.dataset.theme = S.theme; render(); return; }
  const sc = e.target.closest('[role=tab][data-scene]');
  if(sc){ S.scene = sc.dataset.scene; renderStage(); return; }
  const nb = e.target.closest('.note-btn');
  if(nb){
    const was = nb.getAttribute('aria-pressed') === 'true';
    document.querySelectorAll('.note-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    nb.setAttribute('aria-pressed', String(!was)); relight(); return;
  }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const t = T(), box = cp.closest('[data-cta]'), st = box && box.querySelector('[data-copy-status]');
    const say = (ok) => { cp.querySelector('span').textContent = ok ? t.copied : t.copy; if(st) st.textContent = ok ? t.copied : t.copyFail; cp.firstElementChild.outerHTML = ic(ok ? 'check' : 'copy'); setTimeout(() => { cp.querySelector('span').textContent = t.copy; cp.firstElementChild.outerHTML = ic('copy'); if(st) st.textContent = ''; }, 2000); };
    (navigator.clipboard ? navigator.clipboard.writeText(CMD) : Promise.reject()).then(() => say(true), () => { const code = box && box.querySelector('code'); if(code){ const r = document.createRange(); r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } say(false); });
  }
});
['mouseover','focusin'].forEach(ev => document.addEventListener(ev, e => {
  const nb = e.target.closest && e.target.closest('.note-btn');
  if(nb) light(nb.dataset.hlTarget);
}));
['mouseout','focusout'].forEach(ev => document.addEventListener(ev, e => {
  const nb = e.target.closest && e.target.closest('.note-btn');
  if(!nb) return;
  relight();
}));
document.addEventListener('keydown', e => {
  const list = e.target.closest && e.target.closest('[role=tablist]');
  if(!list) return;
  const tabs = [...list.querySelectorAll('[role=tab]')];
  const i = tabs.findIndex(x => x.dataset.scene === S.scene);
  let n = null;
  if(['ArrowRight','ArrowDown'].includes(e.key)) n = (i + 1) % tabs.length;
  if(['ArrowLeft','ArrowUp'].includes(e.key)) n = (i - 1 + tabs.length) % tabs.length;
  if(e.key === 'Home') n = 0; if(e.key === 'End') n = tabs.length - 1;
  if(n === null) return;
  e.preventDefault(); S.scene = tabs[n].dataset.scene; renderStage(); list.querySelector(`[data-scene="${S.scene}"]`).focus();
});
const nav = $('nav');
addEventListener('scroll', () => nav.classList.toggle('scrolled', scrollY > 8), {passive:true});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => paintBands(), 80); });
const q = new URLSearchParams(location.search);
if(q.get('lang') === 'tr') S.lang = 'tr';
if(['light','dark'].includes(q.get('theme'))){ S.theme = q.get('theme'); root.dataset.theme = S.theme; }
if(q.get('scene')) S.scene = q.get('scene');
render();
if(document.fonts) document.fonts.ready.then(() => { for(const k in cwCache) delete cwCache[k]; paintBands(); });
})();

</script>
</body>
</html>
